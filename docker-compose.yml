services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: aeris-hk-postgis
    environment:
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: aeris
      POSTGRES_DB: aeris
    ports:
      - "5432:5432"
    volumes:
      - aeris_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aeris_postgis:
